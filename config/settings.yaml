  size: "1080x1350"
  raw_base: "https://raw.githubusercontent.com/omidot/ai-social-automation/master"
  brand:
    accent: "#1D4ED8"
    ink: "#111111"
    handle: "A Hít Official"
    kicker: "A HÍT OFFICIAL"
    # light "item" slides
    item_bg: "#F1F2F4"
    item_dot: "#E2E4E8"
    body_ink: "#3A3F4A"
    progress_off: "#D4D7DD"
    swipe_hint: "#8A90A0"
    watermark: "#E6E8EC"
    muted: "#6B6B6B"
    tile_icon: "#1F2937"
    # dark "hook" slide
    hook_bg: "#0B0B10"
    hook_dot: "#1A1A22"
    hook_glow: "#1D4ED8"
    hook_body: "#B9BDC9"
    hook_progress_off: "#2A2A35"
    cta_border: "#6B7280"
