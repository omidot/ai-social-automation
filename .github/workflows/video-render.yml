name: video-render
on:
  schedule:
    - cron: '3-59/10 * * * *'   # every 10 min, offset from article-approve (*/5)
  workflow_dispatch:
permissions:
  contents: write
env:
  # 'small' is markedly more accurate on Vietnamese than 'base'; keep it
  # unless CI time forces a trade-off.
  WHISPER_MODEL_SIZE: small
concurrency:
  group: pipeline-state
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    # 25 was not enough once whisper (model download + transcription) joined
    # the render: the job was killed mid-run, which also skipped the
    # always()-guarded state commit, so the slot silently stayed queued.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Any pending audio?
        id: g
        run: |
          if grep -lRE '"(audio_received|rendered|publishing)"' data/daily/ 2>/dev/null | grep -q .; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.g.outputs.go == '1'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Cache Remotion browser
        if: steps.g.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}
      - name: Video render deps
        if: steps.g.outputs.go == '1'
        run: |
          cd video && npm ci
          npx remotion browser ensure
      - name: Install deps
        if: steps.g.outputs.go == '1'
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Cache Playwright browser
        if: steps.g.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install Playwright Chromium (optional -- screenshot cards only)
        if: steps.g.outputs.go == '1'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Cache Whisper model (optional -- real word-timing only)
        if: steps.g.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-model-${{ runner.os }}-${{ env.WHISPER_MODEL_SIZE }}
      # Fetched in its own step so the cache is populated (and saved) even if
      # a later step is slow -- a download folded into the render step is lost
      # whenever the job is killed before finishing.
      - name: Prefetch Whisper model (optional)
        if: steps.g.outputs.go == '1'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -c "
          from faster_whisper import WhisperModel
          import os
          WhisperModel(os.environ['WHISPER_MODEL_SIZE'], device='cpu', compute_type='int8')
          print('whisper model ready')
          "
      - name: Render + publish
        if: steps.g.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.video.render_run
      - name: Commit state
        if: always()
        run: bash scripts/commit_state.sh
