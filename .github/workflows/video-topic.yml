name: video-topic
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Story title'
        required: true
        default: 'GPT-6 Astra vs Claude Fable 5.1: the benchmark battle splits down the middle'
      url:
        description: 'Source URL'
        required: false
        default: 'https://artificialanalysis.ai/models/comparisons/gpt-6-astra-vs-claude-fable-5-1'
      body:
        description: 'Facts to write from (plain text, any language)'
        required: true
        default: >-
          OpenAI's GPT-6 Astra (launched September 3, 2026) and Anthropic's
          Claude Fable 5.1 are now going head to head, and the two sides
          can't even agree on who wins. On OpenAI's own comparison table,
          Astra leads Fable 5.1 on nearly every published benchmark row. But
          independent evaluator Artificial Analysis reverses that verdict.
          In robot control and computer use, Astra crushes Fable 5.1: 95%
          success versus just 40%, plus advantages in speed, cost,
          debugging and agentic tasks. In coding, Astra wins the published
          benchmark rows by a small margin and wins on efficiency outright,
          but Fable 5.1 holds the only independent coding-agent score that
          beats both models. On raw math, Astra scored 97.6% on
          FrontierMath Tier 4 v2. On raw generation speed, Fable 5.1 is
          actually faster: 65.0 tokens per second versus Astra's 53.9. Both
          models charge the same headline price, $10 per million input
          tokens and $50 per million output tokens, but Artificial Analysis
          found Fable 5.1 costs $3.76 per Intelligence Index task versus
          Astra's $1.67, because Astra needs far fewer tokens to reach the
          same score. The upshot: Astra wins research-level math,
          cybersecurity and abstract reasoning; Fable 5.1 wins agentic
          coding, scientific research agents and cache economics -- there
          is no single overall winner.
permissions:
  contents: write
concurrency:
  group: pipeline-state
  cancel-in-progress: false
jobs:
  topic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -e .
          npm install -g @anthropic-ai/claude-code
      - name: Draft video for the given story
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_TITLE: ${{ inputs.title }}
          TOPIC_URL: ${{ inputs.url }}
          TOPIC_BODY: ${{ inputs.body }}
        run: |
          python -m pipeline.article_run --topic-title "$TOPIC_TITLE" \
            --topic-url "$TOPIC_URL" --topic-body "$TOPIC_BODY"
      - name: Commit state
        run: bash scripts/commit_state.sh
